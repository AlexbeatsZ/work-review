name: Release
on:
  push:
    tags: ['v*']
jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: npm run build
      - run: cargo test --workspace --locked
      - if: runner.os != 'Linux'
        run: cargo build --release --workspace --target ${{ matrix.target }} --locked
      - if: runner.os == 'Linux'
        run: cargo build --release -p work-review-server --target ${{ matrix.target }} --locked
      - name: Package standalone binaries
        shell: bash
        run: |
          mkdir -p package/scripts
          for binary in target/${{ matrix.target }}/release/work-review-agent{,.exe} target/${{ matrix.target }}/release/work-review-server{,.exe}; do
            if [ -f "$binary" ]; then cp "$binary" package/; fi
          done
          cp scripts/install-agent.ps1 scripts/run-agent.ps1 scripts/run-agent-launcher.cs scripts/install-agent.sh scripts/install-hub.ps1 scripts/run-hub.ps1 package/scripts/
          cp README.md package/
          for binary in package/work-review-agent package/work-review-server package/scripts/install-agent.sh; do
            if [ -f "$binary" ]; then chmod +x "$binary"; fi
          done
          tar -czf work-review-${{ matrix.target }}.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: work-review-${{ matrix.target }}
          path: work-review-${{ matrix.target }}.tar.gz
  publish:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
